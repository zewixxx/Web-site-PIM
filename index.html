<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIM Industrie — Maquettes</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font-family: Roboto, "Segoe UI", sans-serif;
      background: #141414;
      color: #fff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
    }
    header strong { font-size: 15px; margin-right: 8px; }
    header button {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      background: #2a2a2a;
      color: #fff;
    }
    header button.on { background: #970232; }
    .view { flex: 1; min-height: 0; background: #fff; }
    .view iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  </style>
</head>
<body>
  <header>
    <strong>PIM Industrie</strong>
    <button type="button" id="show-base" class="on">Maquette</button>
    <button type="button" id="show-alt">Maquette 2.0</button>
  </header>
  <div class="view">
    <iframe id="frame" title="Maquette PIM Industrie" src="maquettes/index.html?v=41#accueil"></iframe>
  </div>
  <script>
    var frame = document.getElementById("frame");
    var baseBtn = document.getElementById("show-base");
    var altBtn = document.getElementById("show-alt");
    var bust = "41";
    function show(which) {
      var alt = which === "alt";
      frame.title = alt ? "Maquette 2.0" : "Maquette";
      frame.src = alt
        ? ("maquette%202.0/index.html?v=" + bust + "#accueil")
        : ("maquettes/index.html?v=" + bust + "#accueil");
      baseBtn.className = alt ? "" : "on";
      altBtn.className = alt ? "on" : "";
    }
    baseBtn.addEventListener("click", function () { show("base"); });
    altBtn.addEventListener("click", function () { show("alt"); });
  </script>
</body>
</html>
