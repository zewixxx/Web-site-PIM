<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIM Industrie — Plan de refonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  :root {
    --pim: #970232;
    --ink: #1c1c1c;
    --muted: #5c5c5c;
    --line: #e6e0e0;
    --paper: #f6f3f3;
    --white: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; font-family: Roboto, "Segoe UI", sans-serif; color: var(--ink); }
  button { font-family: inherit; }
  .deck { height: 100%; display: grid; grid-template-rows: 1fr auto; }
  .stage { display: grid; place-items: center; padding: 28px 24px 8px; }
  .slide {
    display: none;
    width: min(1120px, 100%);
    height: min(630px, calc(100vh - 92px));
    background: var(--white);
    padding: 48px 56px 40px;
    position: relative;
    overflow: hidden;
  }
  .slide.on { display: flex; flex-direction: column; }
  .slide.dark { background: var(--ink); color: white; }
  .kicker { margin: 0 0 10px; color: var(--pim); letter-spacing: 0.14em; text-transform: uppercase; font-size: 13px; font-weight: 500; }
  .dark .kicker { color: #e7b3c4; }
  h1 { margin: 0; font-size: 46px; line-height: 1.08; font-weight: 500; letter-spacing: -0.03em; }
  h2 { margin: 0 0 18px; font-size: 34px; line-height: 1.15; font-weight: 500; letter-spacing: -0.02em; }
  .lead { font-size: 20px; line-height: 1.45; max-width: 760px; color: #444; }
  .dark .lead { color: rgba(255,255,255,0.82); }
  ul { margin: 8px 0 0; padding: 0; list-style: none; }
  li { position: relative; padding: 7px 0 7px 18px; line-height: 1.4; font-size: 18px; }
  li::before { content: ""; width: 7px; height: 7px; background: var(--pim); position: absolute; left: 0; top: 14px; }
  .dark li::before { background: #e7b3c4; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 8px; }
  .cols h3 { margin: 0 0 8px; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pim); font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 22px; }
  .stat { background: var(--paper); padding: 16px 14px; min-height: 108px; }
  .stat b { display: block; font-size: 26px; font-weight: 500; color: var(--pim); letter-spacing: -0.03em; }
  .stat span { display: block; margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.35; }
  .steps { display: grid; gap: 10px; margin-top: 6px; }
  .step { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: start; }
  .num { font-size: 28px; color: var(--pim); font-weight: 500; line-height: 1; }
  .step strong { display: block; font-size: 18px; font-weight: 500; }
  .step span { color: var(--muted); font-size: 15px; line-height: 1.4; }
  .flow { display: grid; grid-template-columns: 1.1fr auto 1fr auto 1.1fr; gap: 10px; align-items: stretch; margin-top: 28px; }
  .box { border: 1px solid var(--line); padding: 16px; }
  .box strong { display: block; margin-bottom: 6px; }
  .box p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .arrow { align-self: center; color: var(--pim); font-size: 22px; }
  .bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; color: #ddd; font-size: 13px; }
  .bar button { background: transparent; color: #ddd; border: 1px solid #444; padding: 6px 10px; cursor: pointer; }
  .bar button:hover { border-color: #e7b3c4; color: white; }
  .progress { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--pim); }
  .notes { display: none; position: absolute; left: 56px; right: 56px; bottom: 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
  body.show-notes .notes { display: block; }
  .foot { margin-top: auto; font-size: 13px; color: #888; }
  .dark .foot { color: rgba(255,255,255,0.45); }
</style>
</head>

    notes: "La gamme web-to-print reste une autre marque. PIM peut la citer comme savoir-faire, sans mélanger les discours."

    html: `

const stage = document.getElementById("stage");
const count = document.getElementById("count");
let index = 0;

function render() {
  const slide = slides[index];
  stage.innerHTML = `<article class="slide on${slide.dark ? " dark" : ""}">${slide.html}<div class="notes">${slide.notes || ""}</div><div class="progress" style="width:${((index + 1) / slides.length) * 100}%"></div></article>`;
  count.textContent = (index + 1) + " / " + slides.length;
}

function go(next) {
  index = Math.max(0, Math.min(slides.length - 1, next));
  render();
}

document.getElementById("prev").onclick = () => go(index - 1);
document.getElementById("next").onclick = () => go(index + 1);
document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") { event.preventDefault(); go(index + 1); }
  if (event.key === "ArrowLeft" || event.key === "PageUp") { event.preventDefault(); go(index - 1); }
  if (event.key === "Home") go(0);
  if (event.key === "End") go(slides.length - 1);
  if (event.key === "n" || event.key === "N") document.body.classList.toggle("show-notes");
  if (event.key === "f" || event.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
render();
</script>
